# pnpm workspace configuration.
#
# `allowBuilds` is the supply-chain control that makes pnpm safer than npm here.
# pnpm refuses to run install-time lifecycle scripts (preinstall/install/
# postinstall) unless the package is explicitly approved below. Under npm every
# transitive package can execute arbitrary code during `npm install`, which is
# the standard vector for compromised-package attacks.
#
# Only approve a package if it genuinely needs to compile or download a native
# binary. Each `true` grants that package's maintainers arbitrary code execution
# on developer machines and in CI.
#
#   bcrypt      - compiles a native node-gyp addon (password hashing)
#   bufferutil  - optional native WebSocket speedup (ws)
#   esbuild     - downloads/links the platform build binary; vite/tsup need it
#   sharp       - native libvips image processing binary
#   es5-ext     - denied: only prints a postinstall banner, needs no build
#
# Regenerate/modify with `pnpm approve-builds`, then review the diff.
allowBuilds:
  bcrypt: true
  bufferutil: true
  es5-ext: false
  esbuild: true
  sharp: true

# `pnpm import` inherited this from the npm lockfile. Left on, pnpm silently
# invents peer dependencies instead of surfacing genuine version conflicts,
# which is how the vite/vitest mismatch stayed hidden under npm. Keep it off so
# incompatible peers fail loudly at install time.
autoInstallPeers: false

# drizzle-kit 0.30.6 (and 0.31.11) reads any empty-array column default back as
# '{""}', so `events.interest_areas DEFAULT '{}'` showed up as a change on every
# push. The patch returns '{}' for that case. Drop it once an upgrade fixes
# defaultForColumn upstream; `pnpm db:diff` reporting 0 statements is the check.
patchedDependencies:
  drizzle-kit@0.30.6: patches/drizzle-kit@0.30.6.patch

# Supply-chain policies. pnpm 11 re-checks EVERY lockfile entry against these on
# every install, --frozen-lockfile included (CI and the EC2 deploy too), so a
# lockfile that breaks a policy fails the build. Run `pnpm install` locally
# after changing them.
#
# New versions wait 3 days (in minutes) before pnpm resolves them: compromised
# releases are usually caught and unpublished within hours to a day. pnpm 11
# defaults to 1 day; setting it explicitly also turns on minimumReleaseAgeStrict,
# so an install fails instead of silently picking an older version. An urgent
# security fix can skip the wait through `minimumReleaseAgeExclude`.
minimumReleaseAge: 4320

# Fail when a release's publish trust drops below the package's earlier
# releases (e.g. published by hand after CI-with-provenance releases): the usual
# sign of a stolen publish token. Releases older than 30 days skip the check:
# maintenance releases of old majors (vite 5, semver 6, chokidar 4) trip it
# legitimately, and a hijacked release does not stay up that long.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
