# Managed by Jcode - hardened config
# Backup of original: /root/cdpipass.nginx.bak.*

# ---------------------------------------------------------------------------
# Default catch-all: drop requests that arrive by raw IP or unknown Host.
# 444 = close connection without response (nginx-specific).
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    server_name _;

    # Reuse the existing LE cert purely to complete the TLS handshake before
    # dropping. The name will not match, which is intended for raw-IP access.
    ssl_certificate /etc/letsencrypt/live/cdpipass.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdpipass.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 444;
}

# ---------------------------------------------------------------------------
# Canonical host: www.cdpipass.com.br
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name www.cdpipass.com.br;

    ssl_certificate /etc/letsencrypt/live/cdpipass.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cdpipass.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # --- Security headers ---
    # HSTS starts SHORT (300s) on purpose. Ramp to 1 year only after verifying.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # CSP in REPORT-ONLY first so the React SPA cannot break.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Do not leak upstream server identity
    proxy_hide_header X-Powered-By;
    server_tokens off;

    client_max_body_size 50m;

    # Long-cache immutable hashed build assets
    location /assets/ {
        proxy_pass http://localhost:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://localhost:5003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_hide_header X-Powered-By;
    }
}

# ---------------------------------------------------------------------------
# Apex -> redirect to canonical www (HTTPS, so HSTS applies to apex too)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name cdpipass.com.br;

    ssl_certificate /etc/letsencrypt/live/cdpipass.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cdpipass.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Serve API/webhooks on the apex directly. A 301 on POST is unreliable:
    # many clients (incl. payment gateways) drop the body or downgrade to GET,
    # which would silently break Asaas payment webhooks.
    location /api/ {
        proxy_pass http://localhost:5003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_hide_header X-Powered-By;
    }

    # Browser traffic gets redirected to the canonical www host.
    location / {
        return 301 https://www.cdpipass.com.br$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Port 80 -> HTTPS. ACME challenge stays reachable for certbot renewals.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name cdpipass.com.br www.cdpipass.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.cdpipass.com.br$request_uri;
    }
}
