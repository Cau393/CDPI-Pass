name: CI/CD Pipeline

on:
  push:
    branches:
      - hotfix-frontend-update
  # PRs into the deploy branch run the tests and the security scans; only a
  # push (the merge) deploys, see the `if` on the deploy job.
  pull_request:
    branches:
      - hotfix-frontend-update

# No job writes to the repo through GITHUB_TOKEN; the deploy uses its own secrets.
permissions:
  contents: read

# Actions are pinned to a commit SHA (the tag is in the trailing comment): a tag
# can be re-pointed, and the deploy job hands its actions the EC2 SSH key and
# the AWS keys.

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    # Service container: throwaway PostgreSQL for integration tests.
    # The integration suite (server/test/integration) boots the real Express
    # app and writes/deletes rows, so it must never touch Neon.
    services:
      postgres:
        # Public ECR mirror of the official image: Docker Hub rate-limits anonymous CI pulls.
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: cdpi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      VERIFY_DATABASE_URL: postgresql://postgres:verify@localhost:5432/cdpi

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Installs the pnpm version pinned by "packageManager" in
      # frontend/package.json, so CI cannot drift from local/prod.
      # package_json_file is required because this repo's package.json lives
      # in frontend/, not at the root, and the action defaults to the root.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      # --frozen-lockfile makes CI fail on lockfile/package.json drift instead
      # of silently resolving different versions than were reviewed.
      - name: Install Dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm run check

      # Push the Drizzle schema to the CI service container so the
      # integration tests have tables to write to.
      - name: Push schema to integration DB
        working-directory: frontend
        env:
          DATABASE_URL: ${{ env.VERIFY_DATABASE_URL }}
        run: pnpm run db:push

      - name: Run Unit Tests
        working-directory: frontend
        run: pnpm run test:frontend && pnpm run test:backend

      - name: Run Integration Tests
        working-directory: frontend
        env:
          VERIFY_DATABASE_URL: ${{ env.VERIFY_DATABASE_URL }}
        run: pnpm run test:integration

  # Fails on a new secret in git history, a semgrep ERROR, or a HIGH/CRITICAL
  # dependency or IaC finding. Accepted findings live in .trivyignore.yaml, each
  # with a reason and an expiry; osv-scanner and pnpm audit only report.
  # Scanner binaries are pinned by version and sha256 (from the release's
  # checksums file).
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      OSV_SCANNER_VERSION: 2.7.0
      OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
      TRIVY_VERSION: 0.75.0
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
      SEMGREP_VERSION: 1.180.0

    steps:
      # Full history: gitleaks scans every commit, because the repo is public.
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install scanners
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/bin"; mkdir -p "$BIN"; cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C "$BIN" gitleaks
          curl -sSfL -o "$BIN/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $BIN/osv-scanner" | sha256sum -c -
          chmod +x "$BIN/osv-scanner"
          curl -sSfL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz -C "$BIN" trivy
          pipx install "semgrep==${SEMGREP_VERSION}"
          echo "$BIN" >> "$GITHUB_PATH"

      # --redact keeps any match out of the public CI log.
      - name: Secrets in git history (gitleaks)
        run: gitleaks git --log-opts="--all" --redact --no-banner .

      # Same rulesets as the batch-3 baseline.
      - name: Code (semgrep)
        run: >-
          semgrep scan --metrics=off --error --severity ERROR
          --config p/owasp-top-ten --config p/nodejs --config p/expressjs
          --config p/typescript --config p/javascript --config p/react --config p/jwt
          --exclude CDPI-Pass-Vault --exclude frontend/dist
          frontend infra .github

      - name: Dependencies and IaC (trivy)
        run: >-
          trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1
          --ignorefile .trivyignore.yaml
          --skip-dirs CDPI-Pass-Vault --skip-dirs frontend/dist
          .

      # Report-only cross-checks against other advisory databases; trivy is
      # the gate. Exit 1 means "vulnerabilities found", anything else is a
      # scanner or registry error and fails the step.
      - name: Dependencies cross-check (osv-scanner)
        if: ${{ !cancelled() }}
        run: |
          set +e
          osv-scanner scan source --lockfile frontend/pnpm-lock.yaml --format markdown > osv.md
          code=$?
          { echo "## osv-scanner"; cat osv.md; } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" -le 1 ]

      - name: Setup pnpm
        if: ${{ !cancelled() }}
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json

      - name: Dependencies cross-check (pnpm audit)
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: |
          set +e
          pnpm audit --prod > audit.txt
          code=$?
          { echo "## pnpm audit --prod"; echo '```'; cat audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" -le 1 ]

  deploy:
    name: Deploy to EC2
    # Deliberately not gated on `security`: a CVE published against an
    # existing dependency must not block a check-in or printing hotfix. The
    # security job gates the PR instead (the owner merges only on green).
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub Runner IP
        id: ip
        run: echo "ipv4=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Add GitHub IP to Security Group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      # Deploys the way production actually runs: a git checkout at
      # ~/CDPI-Pass built in place and served by PM2.
      #
      # This previously built a Docker image and ran it with -p 5003:5003
      # against ~/app/frontend/.env. That never reached production:
      #   - production is PM2 from ~/CDPI-Pass/frontend, not a container
      #   - the container came up with no port bindings at all and could not
      #     resolve the Neon host, so it was a no-op that "succeeded"
      # Result: CI was green for months while production stayed on the build
      # from 2026-04-30, 19 commits behind, including two security fixes.
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd ~/CDPI-Pass

            # Keep a rollback point. dist/ is the only artifact that matters,
            # since the box builds in place.
            TS=$(date +%Y%m%d-%H%M%S)
            cp -r frontend/dist ~/dist-rollback-$TS || true
            git rev-parse HEAD > ~/rollback-commit-$TS.txt || true
            # Keep only the 5 most recent rollback points.
            ls -dt ~/dist-rollback-* 2>/dev/null | tail -n +6 | xargs -r rm -rf
            ls -t ~/rollback-commit-*.txt 2>/dev/null | tail -n +6 | xargs -r rm -f

            # dist/ is committed to the repo, so a build would otherwise
            # conflict with the pull.
            git checkout -- frontend/dist ecosystem.config.cjs 2>/dev/null || true
            git pull --ff-only origin hotfix-frontend-update

            cd frontend
            export PATH="$HOME/.local/share/pnpm:$PATH"
            corepack enable || true
            corepack prepare pnpm@11.5.2 --activate

            pnpm install --frozen-lockfile

            # t2.micro has 954MB. Cap the heap so the build cannot OOM-kill
            # the running app; there is a 2GB swapfile as a further backstop.
            NODE_OPTIONS="--max-old-space-size=1536" pnpm run build

            # Smoke-test the new build on a spare port BEFORE cutting over,
            # so a broken build never replaces a working one.
            PORT=5195 NODE_ENV=production nohup node dist/index.js > /tmp/deploy-smoke.log 2>&1 &
            SMOKE_PID=$!
            sleep 12
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5195/api/events --max-time 15 || echo 000)
            kill $SMOKE_PID 2>/dev/null || true
            if [ "$CODE" != "200" ]; then
              echo "SMOKE TEST FAILED (/api/events -> $CODE). Not restarting the live app."
              tail -30 /tmp/deploy-smoke.log
              exit 1
            fi
            echo "Smoke test OK."

            pm2 restart cdpi-pass --update-env
            sleep 8

            LIVE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5003/api/events --max-time 15 || echo 000)
            if [ "$LIVE" != "200" ]; then
              echo "LIVE CHECK FAILED (/api/events -> $LIVE). Rolling back."
              rm -rf dist && cp -r ~/dist-rollback-$TS dist
              pm2 restart cdpi-pass --update-env
              exit 1
            fi
            echo "Deploy OK. Live /api/events -> $LIVE"

            # The e-mail worker runs the same build (dist/run-email-worker.js);
            # without this it keeps the code from its last manual restart.
            pm2 restart cdpi-pass-email-worker --update-env
            pm2 save

      - name: Remove GitHub IP from Security Group
        if: always()
        env:
          # Injecting these ensures the cleanup works EVEN IF previous steps failed
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1 
        run: |
          if [ -n "${{ steps.ip.outputs.ipv4 }}" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id ${{ secrets.AWS_SG_ID }} \
              --protocol tcp \
              --port 22 \
              --cidr ${{ steps.ip.outputs.ipv4 }}/32 || echo "Rule might already be removed."
          else
            echo "IP was never fetched, nothing to remove."
          fi
