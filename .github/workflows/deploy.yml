name: CI/CD Pipeline

on:
  push:
    branches:
      - hotfix-frontend-update

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm install --no-fund --no-audit

      - name: Run Tests
        working-directory: frontend
        run: npm run test

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          # Fully lowercase to satisfy Docker
          tags: ghcr.io/cau393/cdpi-pass:latest

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub Runner IP
        id: ip
        # Bulletproof way to get the runner's IP
        run: echo "ipv4=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Add GitHub IP to Security Group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Fully lowercase to satisfy Docker
            docker pull ghcr.io/cau393/cdpi-pass:latest
            
            docker stop cdpi-pass || true
            docker rm cdpi-pass || true
            
            docker run -d \
              --name cdpi-pass \
              --restart unless-stopped \
              -p 5003:5003 \
              --env-file /home/${{ secrets.EC2_USERNAME }}/app/frontend/.env \
              ghcr.io/cau393/cdpi-pass:latest
              
            docker image prune -f

      - name: Remove GitHub IP from Security Group
        if: always()
        env:
          # Injecting these ensures the cleanup works EVEN IF previous steps failed
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1 
        run: |
          if [ -n "${{ steps.ip.outputs.ipv4 }}" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id ${{ secrets.AWS_SG_ID }} \
              --protocol tcp \
              --port 22 \
              --cidr ${{ steps.ip.outputs.ipv4 }}/32 || echo "Rule might already be removed."
          else
            echo "IP was never fetched, nothing to remove."
          fi